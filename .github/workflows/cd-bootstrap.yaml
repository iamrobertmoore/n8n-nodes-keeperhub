name: CD (bootstrap — first publish only)

# npm will not let you configure OIDC trusted publishing for a package that does
# not exist yet, so the very first version has to be published with a token.
# This workflow does that from GitHub Actions with `--provenance` still enabled,
# which is what n8n requires of community nodes published after 1 May 2026.
#
# After the first successful run:
#   1. npmjs.com -> the package -> Settings -> Trusted Publisher -> add this repo
#      with workflow `cd.yaml`.
#   2. Delete the NPM_TOKEN repository secret.
#   3. Delete this file. `cd.yaml` handles every release from then on, tokenless.

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
